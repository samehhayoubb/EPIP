services:
  db:
    image: pgvector/pgvector:pg17
    container_name: epip-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - epip_pgdata:/var/lib/postgresql/data

volumes:
  epip_pgdata: